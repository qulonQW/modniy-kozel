<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Каталог — Modniy Kozel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="./public/images/logo/logo-mark.png">
</head>
<body class="has-nav">
  <div class="page">
    <header class="header">
      <h1 class="page-title">Каталог</h1>
      <a class="icon-btn icon-btn-end" href="./cart.html" data-cart-link aria-label="Кошик"></a>
    </header>

    <div class="filter filter-sticky" id="filter"></div>

    <main class="section grid-page">
      <div id="grid"></div>
    </main>
  </div>

  <nav data-nav="catalog" aria-label="Головне меню"></nav>

  <script src="./products.js"></script>
  <script src="./cart.js"></script>
  <script src="./app.js"></script>
  <script>
    const grid = document.getElementById('grid');

    function show(category) {
      MK.renderGrid(grid, category ? PRODUCTS.filter((p) => p.category === category) : PRODUCTS);
    }

    PRODUCTS_READY.then((loaded) => {
      if (!loaded) {
        MK.showLoadError(grid);
        return;
      }
      MK.mountFilter(document.getElementById('filter'), show);
      show(null);
    });
  </script>
</body>
</html>
