<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Кошик — Modniy Kozel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="./public/images/logo/logo-mark.png">
</head>
<body class="has-nav">
  <div class="page">
    <header class="header">
      <h1 class="page-title">Кошик</h1>
    </header>

    <main>
      <div class="section" id="filled" hidden>
        <div class="notices" id="notices"></div>
        <div class="cart-list" id="list"></div>
        <div class="summary">
          <div class="summary-row"><span>Сума</span><span id="subtotal"></span></div>
          <div class="summary-row"><span>Доставка</span><span>Нова Пошта</span></div>
          <p class="summary-note">Вартість доставки за тарифами перевізника</p>
          <div class="summary-row summary-total"><span>До сплати</span><span id="total"></span></div>
        </div>
        <a class="btn" href="./checkout.html" id="to-checkout">Оформити замовлення</a>
      </div>

      <div class="empty" id="empty" hidden>
        <h2 class="empty-title">Кошик порожній</h2>
        <a class="btn btn-inline" href="./catalog.html">До каталогу</a>
      </div>
    </main>
  </div>

  <nav data-nav="cart" aria-label="Головне меню"></nav>

  <script src="./texts.js"></script>
  <script src="./products.js"></script>
  <script src="./cart.js"></script>
  <script src="./app.js"></script>
  <script>
    const list = document.getElementById('list');

    function removeIcon() {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('class', 'icon');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('aria-hidden', 'true');
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', 'M6 6l12 12M18 6L6 18');
      svg.append(path);
      return svg;
    }

    let notes = []; // one-time notices from the last load (removed items, price changes)

    function lineNote(line) {
      if (line.status === 'out_of_stock') return TEXTS.cart.outOfStock;
      if (line.status === 'invalid_size') return TEXTS.cart.sizeUnavailable;
      if (line.oldPrice !== null) return TEXTS.cart.priceChanged(MK.formatPrice(line.oldPrice));
      return null;
    }

    function render() {
      const items = MKCart.getItems();
      const orderable = MKCart.getOrderable();
      document.getElementById('filled').hidden = items.length === 0;
      document.getElementById('empty').hidden = items.length > 0;

      const skipped = items.length > orderable.length;
      document.getElementById('notices').replaceChildren(
        ...[...notes, skipped ? TEXTS.cart.skipped : null]
          .filter(Boolean)
          .map((text) => MK.el('p', { class: 'notice' }, text))
      );

      list.replaceChildren(...items.map((line) => {
        const { product: p, size, qty } = line;
        const note = lineNote(line);
        return MK.el('article', { class: line.status === 'ok' ? 'cart-item' : 'cart-item is-blocked' },
          MK.el('a', { class: 'cart-thumb', href: `./product.html?id=${encodeURIComponent(p.id)}` },
            MK.el('img', { src: p.imageUrl, alt: p.name, loading: 'lazy', width: 72, height: 96 })),
          MK.el('div', { class: 'cart-info' },
            MK.el('h2', { class: 'cart-name' }, p.name),
            MK.el('p', { class: 'cart-size' }, `${size ? `Розмір ${size}` : ''}${size && qty > 1 ? ' · ' : ''}${qty > 1 ? `${qty} шт.` : ''}`),
            note ? MK.el('p', { class: line.status === 'ok' ? 'line-note' : 'line-note line-note-bad' }, note) : null,
            MK.el('p', { class: 'price cart-price' }, MK.formatPrice(p.price * qty))),
          MK.el('button', {
            class: 'icon-btn cart-remove', type: 'button', 'data-id': p.id, 'data-size': size,
            'aria-label': `Видалити ${p.name}`,
          }, removeIcon()));
      }));

      const total = MK.formatPrice(MKCart.getTotal());
      document.getElementById('subtotal').textContent = total;
      document.getElementById('total').textContent = total;
      const checkout = document.getElementById('to-checkout');
      checkout.classList.toggle('btn-disabled', orderable.length === 0);
      checkout.setAttribute('aria-disabled', String(orderable.length === 0));
      MK.refreshCartBadges();
    }

    document.getElementById('to-checkout').addEventListener('click', (event) => {
      if (MKCart.getOrderable().length === 0) {
        event.preventDefault();
        MK.notify(TEXTS.cart.nothingToOrder);
      }
    });

    list.addEventListener('click', (event) => {
      const button = event.target.closest('.cart-remove');
      if (!button) return;
      MKCart.remove(button.dataset.id, button.dataset.size);
      render();
    });

    PRODUCTS_READY.then((loaded) => {
      if (!loaded) {
        // Not "cart is empty": the cart is still there, prices just can't load.
        document.getElementById('filled').hidden = true;
        MK.showLoadError(document.getElementById('empty'));
        return;
      }
      // Shown once: items that disappeared, and prices that changed since they
      // were added. The total below is already the current one.
      const removed = MKCart.pruneMissing();
      const repriced = MKCart.review().some((l) => l.oldPrice !== null);
      notes = [removed ? TEXTS.cart.removed(removed) : null, repriced ? TEXTS.cart.pricesUpdated : null];
      render();
      MKCart.acknowledgePrices();
      window.addEventListener('pageshow', render);
    });
  </script>
</body>
</html>
