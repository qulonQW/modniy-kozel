<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Modniy Kozel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="./public/images/logo/logo-mark.png">
</head>
<body class="has-nav">
  <div class="page">
    <header class="header">
      <a class="logo" href="./index.html"><img src="./public/images/logo/logo-mark.png" alt="MK" width="28" height="28" onerror="this.replaceWith('MK')"></a>
      <a class="icon-btn icon-btn-end" href="./cart.html" data-cart-link aria-label="Кошик"></a>
    </header>

    <section class="hero">
      <h1 class="hero-title">Modniy<br>Kozel</h1>
      <p class="hero-tagline">Брендовий одяг. Без компромісів.</p>
    </section>

    <div class="filter" id="filter"></div>

    <main class="section">
      <h2 class="section-title" id="grid-title">Популярне</h2>
      <div id="grid"></div>
    </main>
  </div>

  <nav data-nav="home" aria-label="Головне меню"></nav>

  <script src="./products.js"></script>
  <script src="./cart.js"></script>
  <script src="./app.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const title = document.getElementById('grid-title');

    function show(category) {
      title.textContent = category || 'Популярне';
      MK.renderGrid(grid, category
        ? PRODUCTS.filter((p) => p.category === category)
        : PRODUCTS.filter((p) => p.popular));
    }

    PRODUCTS_READY.then((loaded) => {
      if (!loaded) {
        MK.showLoadError(grid);
        return;
      }
      MK.mountFilter(document.getElementById('filter'), show);
      show(null);
    });
  </script>
</body>
</html>
