<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Modniy Kozel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="./public/images/logo/logo-mark.png">
</head>
<body class="has-nav">
  <div class="page">
    <header class="header">
      <a class="logo" href="./index.html"><img src="./public/images/logo/logo-mark.png" alt="MK" width="28" height="28" onerror="this.replaceWith('MK')"></a>
      <a class="icon-btn icon-btn-end" href="./cart.html" data-cart-link aria-label="Кошик"></a>
    </header>

    <section class="hero">
      <h1 class="hero-title">Modniy<br>Kozel</h1>
      <p class="hero-tagline">Брендовий одяг. Без компромісів.</p>
    </section>

    <div class="filter" id="filter"></div>

    <main class="section">
      <h2 class="section-title" id="grid-title">Популярне</h2>
      <div id="grid"><p class="empty-note">Завантаження…</p></div>
      <a class="btn btn-secondary" id="home-more" href="./catalog.html" hidden>Дивитися весь каталог</a>
    </main>
  </div>

  <nav data-nav="home" aria-label="Головне меню"></nav>

  <script src="./products.js"></script>
  <script src="./cart.js"></script>
  <script src="./app.js"></script>
  <script>
    // Home loads one small page from the server: popular items, or the first
    // items of a category (the full list is on catalog.html).
    const HOME_LIMIT = 12;
    const grid = document.getElementById('grid');
    const title = document.getElementById('grid-title');
    const more = document.getElementById('home-more');
    let controller = null;

    async function show(category) {
      title.textContent = category || 'Популярне';
      if (controller) controller.abort();
      const current = new AbortController();
      controller = current;
      const params = new URLSearchParams({ limit: HOME_LIMIT });
      if (category) params.set('category', category);
      else params.set('popular', 'true');
      grid.classList.add('grid-loading');
      try {
        const res = await fetch(`${API_BASE_URL}/api/catalog?${params}`, {
          signal: current.signal,
          headers: { Accept: 'application/json' },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (controller !== current) return;
        grid.classList.remove('grid-loading');
        MK.renderGrid(grid, data.items.map(normalizeProduct));
        const href = category ? `./catalog.html?category=${encodeURIComponent(category)}` : './catalog.html';
        more.href = href;
        more.hidden = false;
      } catch (err) {
        if (controller !== current) return;
        console.warn('Home could not be loaded:', err.name);
        grid.classList.remove('grid-loading');
        more.hidden = true;
        MK.showLoadError(grid);
      }
    }

    MK.mountFilter(document.getElementById('filter'), show);
    show(null);
  </script>
</body>
</html>
